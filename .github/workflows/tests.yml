name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run test suite (offline, no API key)
        env:
          LEARNFORGE_ALLOW_MODEL_DOWNLOAD: "1"
        run: python -m pytest tests -q
      - name: Run evaluation benchmark
        env:
          LEARNFORGE_ALLOW_MODEL_DOWNLOAD: "1"
        run: python -m learnforge.evaluation --repeats 1
